specs:
  German:
    numGenders: 3
    genders: ['m', 'f', 'n']
    numCases: 4
    cases: ['nominative', 'accusative', 'dative', 'genitive']
    nounsInflect: 0
    verbConjugations: ['1psing', '1ppl', '2pfam', '2pfampl', '2ppol', '2ppolpl', '3psing', '3ppl']
    tenses: ['present', 'future', 'simple_past', 'pres_perf']
  Russian:
    numGenders: 3
    genders: ['m', 'f', 'n']
    numCases: 6
    cases: ['nominative', 'accusative', 'dative', 'genitive', 'instrumental', 'prepositional']
    nounsInflect: 1
    # Present and compound future use person/number; past singular also needs gender.
    verbConjugations: ['1psing', '2psing', '3psing', '1ppl', '2ppl', '3ppl']
    tenses: ['present', 'past', 'future']
    tenseSubjects-past: ['1psing_m', '1psing_f', '2psing_m', '2psing_f', '3psing_m', '3psing_f', '3psing_n', '1ppl', '2ppl', '3ppl']
  Polish:
    numGenders: 3
    genders: ['m', 'f', 'n']
    numCases: 7
    cases: ['nominative', 'accusative', 'dative', 'genitive', 'instrumental', 'vocative', 'locative']
    nounsInflect: 1
    verbConjugations: ['1psing', '1ppl', '2pfam', '2pfampl', '2ppol', '2ppolpl', '3psing', '3ppl']
  French:
    numGenders: 2
    genders: ['m', 'f']
    numCases: 0
    cases: []
    nounsInflect: 0
    verbConjugations: ['1psing', '1ppl', '2pfam', '2pfampl', '2ppol', '2ppolpl', '3psing', '3ppl']
  Spanish:
    numGenders: 2
    genders: ['m', 'f']
    numCases: 0
    cases: []
    nounsInflect: 0
    # Mexican Spanish: ustedes is used for plural "you" in all registers.
    verbConjugations: ['1psing', '1ppl', '2pfam', '2ppol', '2ppl', '3psing', '3ppl']
    tenses: ['present', 'present_cont', 'simple_past', 'imperfect_past', 'present_perf', 'pluperfect', 'future', 'future_perf', 'conditional', 'conditional_perf']


# TODO:
# use English as a control, create langspec above for EN


# Key
#   1psing  = 1st person singular: ich
#   1ppl    = 1st person plural: wir
#   2pfam   = 2nd person familir: du
#   2pfampl = 2nd person familir plural: ihr
#   2ppol   = 2nd person polite/formal: Sie
#   2ppolpl = 2nd person polite/formal plural: Sie
#   2ppl    = 2nd person plural without a formality split: ustedes in Mexico
#   3psing  = 3rd person singular: er/sie/es
#   3ppl    = 3rd person plural: sie
#   2psing  = 2nd person singular: ты in Russian
#   1psing_m, 1psing_f, 2psing_m, 2psing_f, 3psing_m, 3psing_f, 3psing_n
#             = Russian past singular subjects with grammatical gender

#   nounsInflect: determine whether the noun or the article inflects on case

# NOTES:
#  - all the fields must be replicated across languages, they are allowed to be
#    empty however if that particular feature does not exist